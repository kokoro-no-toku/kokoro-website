<style>
/* =========================================================
   こころのトーク — Modern Visual Design
   内容・SEO・リンク・料金・LINE導線・ロゴは変更しません
   ========================================================= */

:root {
  --bg: #f7f8f6;
  --bg-soft: #eef3ef;
  --white: #ffffff;

  --ink: #17231f;
  --ink-soft: #4d5d56;
  --muted: #7d8a84;

  --green: #08a85b;
  --green-dark: #087a47;
  --green-soft: #e7f7ef;

  --gold: #b07828;
  --gold-soft: #f4ead7;

  --line: #00b900;

  --navy: #142b35;
  --navy-soft: #1d3b47;

  --border: rgba(23, 35, 31, 0.10);

  --shadow-sm:
    0 4px 16px rgba(20, 43, 53, 0.06);

  --shadow:
    0 18px 55px rgba(20, 43, 53, 0.10);

  --shadow-lg:
    0 30px 80px rgba(20, 43, 53, 0.14);

  --radius-sm: 12px;
  --radius: 20px;
  --radius-lg: 32px;
}

/* =========================
   RESET
   ========================= */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--bg);
}

body {
  font-family:
    'Noto Sans JP',
    -apple-system,
    BlinkMacSystemFont,
    'Hiragino Kaku Gothic ProN',
    'Yu Gothic',
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(8, 168, 91, 0.045),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 10%,
      rgba(176, 120, 40, 0.055),
      transparent 30%
    ),
    var(--bg);

  color: var(--ink);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img {
  max-width: 100%;
}

a {
  -webkit-tap-highlight-color: transparent;
}

::selection {
  background: rgba(8, 168, 91, 0.18);
  color: var(--ink);
}


/* =========================
   ANIMATION
   ========================= */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(24px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes floatLogo {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

@keyframes pulseGlow {
  0%,
  100% {
    box-shadow:
      0 0 0 0 rgba(8, 168, 91, 0.20),
      0 12px 30px rgba(8, 168, 91, 0.12);
  }

  50% {
    box-shadow:
      0 0 0 10px rgba(8, 168, 91, 0),
      0 18px 42px rgba(8, 168, 91, 0.20);
  }
}

.anim {
  opacity: 0;
  animation:
    fadeUp 0.9s cubic-bezier(.2,.8,.2,1)
    forwards;
}

.anim-1 {
  animation-delay: 0.05s;
}

.anim-2 {
  animation-delay: 0.15s;
}

.anim-3 {
  animation-delay: 0.25s;
}

.anim-4 {
  animation-delay: 0.35s;
}

.anim-5 {
  animation-delay: 0.45s;
}

.anim-6 {
  animation-delay: 0.55s;
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition:
    opacity 0.8s ease,
    transform 0.8s cubic-bezier(.2,.8,.2,1);
}

.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  .anim,
  .reveal {
    animation: none !important;
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}


/* =========================
   NAVIGATION
   ========================= */

nav {
  position: sticky;
  top: 0;
  z-index: 1000;

  height: 78px;
  padding: 0 48px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(23, 35, 31, 0.08);

  box-shadow:
    0 4px 24px rgba(20, 43, 53, 0.05);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 11px;

  color: var(--ink);
  text-decoration: none;

  font-family: 'Shippori Mincho', serif;
  font-size: 1.25rem;
  font-weight: 700;

  letter-spacing: 0.02em;
  white-space: nowrap;
}

.nav-icon {
  width: 42px;
  height: 42px;
  object-fit: contain;
}

.nav-logo span {
  color: var(--green-dark);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;
  list-style: none;
}

.nav-links a {
  position: relative;

  color: var(--ink-soft);
  text-decoration: none;

  font-size: 0.83rem;
  font-weight: 600;

  transition:
    color 0.2s ease,
    transform 0.2s ease;
}

.nav-links a:not(.nav-cta)::after {
  content: '';

  position: absolute;
  left: 0;
  right: 0;
  bottom: -7px;

  height: 2px;

  background: var(--green);

  transform: scaleX(0);
  transform-origin: center;

  transition: transform 0.2s ease;
}

.nav-links a:not(.nav-cta):hover {
  color: var(--green-dark);
}

.nav-links a:not(.nav-cta):hover::after {
  transform: scaleX(1);
}

.nav-cta {
  background:
    linear-gradient(
      135deg,
      #11b867,
      #07924d
    );

  color: #fff !important;

  padding: 11px 21px;

  border-radius: 999px;

  box-shadow:
    0 8px 20px rgba(8, 168, 91, 0.20);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    opacity 0.2s ease;
}

.nav-cta:hover {
  transform: translateY(-2px);
  box-shadow:
    0 12px 28px rgba(8, 168, 91, 0.28);
  opacity: 1;
}


/* =========================
   B2B BAR
   ========================= */

body > a[href="btob.html"] {
  position: relative;

  display: block;

  background:
    linear-gradient(
      100deg,
      #132e3a 0%,
      #1c5262 55%,
      #176a72 100%

  color: #fff !important;

  padding: 13px 20px !important;

  text-decoration: none;

  text-align: center;

  font-size: 0.83rem !important;
  font-weight: 700;

  letter-spacing: 0.04em;

    filter 0.2s ease,

}

body > a[href="btob.html"]:hover {

}


/* =========================
   HERO
   ========================= */

.hero {
  position: relative;
  overflow: hidden;

  padding:
    110px 30px
    105px;

  text-align: center;

  background:
    radial-gradient(
      circle at 50% 8%,
      rgba(255,255,255,0.98) 0,
      rgba(255,255,255,0.80) 22%,
      transparent 55%
    ),
    linear-gradient(
      145deg,
      #edf7f1 0%,
      #f7f8f5 42%,
      #f8f1e5 100%
    );

  border-bottom: 1px solid rgba(23,35,31,0.08);
}

.hero::before {
  content: '';

  position: absolute;

  width: 680px;
  height: 680px;

  left: 50%;
  top: 42%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(8,168,91,0.08),
      rgba(8,168,91,0.025) 45%,
      transparent 70%
    );

  pointer-events: none;
}

.hero::after {
  content: '';

  position: absolute;

  width: 320px;
  height: 320px;

  right: -130px;
  top: 80px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(176,120,40,0.10),

.hero-logo {
