<style>
/* =========================================================
   こころのトーク — Modern Redesign
   ※ HTML本文・URL・料金・SEO・ロゴは変更しない
   ========================================================= */

:root {
  --bg: #fbfaf7;
  --bg-soft: #f4f0e9;
  --white: #ffffff;

  --ink: #29251f;
  --ink-soft: #625b51;
  --muted: #968e83;

  --brown: #3a3026;
  --brown-light: #6f6254;

  --gold: #b48a52;
  --gold-light: #e8d8bd;
  --gold-pale: #f7f1e7;

  --line: #06c755;
  --orange: #dc7624;

  --border: #e8e1d7;

  --shadow-sm:
    0 4px 18px rgba(52, 42, 31, 0.05);

  --shadow:
    0 16px 50px rgba(52, 42, 31, 0.08);

  --shadow-lg:
    0 30px 80px rgba(52, 42, 31, 0.12);

  --radius: 18px;
  --radius-sm: 12px;

  --max: 1180px;
}


/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family:
    "Noto Sans JP",
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;

  background: var(--bg);
  color: var(--ink);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

img {
  max-width: 100%;
}

a {
  color: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(22px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes floatLogo {
  0%,
  100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

@keyframes pulseLine {
  0% {
    box-shadow: 0 0 0 0 rgba(6, 199, 85, 0.25);
  }

  70% {
    box-shadow: 0 0 0 12px rgba(6, 199, 85, 0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(6, 199, 85, 0);
  }
}

.anim {
  opacity: 0;
  animation:
    fadeUp 0.9s cubic-bezier(.2,.8,.2,1) forwards;
}

.anim-1 {
  animation-delay: .05s;
}

.anim-2 {
  animation-delay: .15s;
}

.anim-3 {
  animation-delay: .25s;
}

.anim-4 {
  animation-delay: .35s;
}

.anim-5 {
  animation-delay: .45s;
}

.anim-6 {
  animation-delay: .55s;
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition:
    opacity .8s ease,
    transform .8s cubic-bezier(.2,.8,.2,1);
}

.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .anim,
  .reveal {
    animation: none !important;
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav {
  height: 76px;

  padding:
    0 max(24px, calc((100vw - var(--max)) / 2));

  display: flex;
  align-items: center;
  justify-content: space-between;

  position: sticky;
  top: 0;
  z-index: 1000;

  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(180, 138, 82, 0.16);

  box-shadow:
    0 3px 24px rgba(40, 30, 20, 0.04);
}

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;

  color: var(--ink);
  text-decoration: none;

  font-family: "Shippori Mincho", serif;
  font-size: 1.15rem;
  font-weight: 700;

  white-space: nowrap;
}

.nav-icon {
  width: 38px;
  height: 38px;
  object-fit: contain;
}

.nav-logo span {
  color: var(--gold);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 28px;

  list-style: none;
}

.nav-links a {
  color: var(--ink-soft);
  text-decoration: none;

  font-size: .82rem;
  font-weight: 500;

  transition:
    color .2s ease,
    transform .2s ease;
}

.nav-links a:hover {
  color: var(--gold);
}

.nav-cta {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;

  padding: 11px 21px;

  color: #fff !important;
  background: var(--line);

  border-radius: 999px;

  box-shadow:
    0 5px 18px rgba(6, 199, 85, .18);

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease !important;
}

.nav-cta:hover {
  opacity: 1 !important;
  transform: translateY(-2px);
  box-shadow:
    0 8px 24px rgba(6, 199, 85, .25);
}


/* =========================================================
   HERO
   ========================================================= */

.hero {
  position: relative;
  overflow: hidden;

  padding:
    110px 24px
    105px;

  text-align: center;

  background:
    radial-gradient(
      circle at 50% 15%,
      rgba(255,255,255,.95) 0%,
      rgba(255,255,255,.7) 20%,
      transparent 52%
    ),
    linear-gradient(
      180deg,
      #f8f3eb 0%,
      #fbfaf7 70%,
      #f4efe7 100%
    );

  border-bottom: 1px solid var(--border);
}

.hero::before {
  content: "";

  position: absolute;

  width: 720px;
  height: 720px;

  left: 50%;
  top: 40%;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(180,138,82,.08),
      rgba(180,138,82,0) 70%
    );

  pointer-events: none;
}

.hero::after {
  content: "心";

  position: absolute;

  right: -110px;
  bottom: -210px;

  font-family: "Shippori Mincho", serif;
  font-size: 31rem;
  font-weight: 700;

  color: rgba(180,138,82,.035);

  pointer-events: none;
}

.hero > * {
  position: relative;
  z-index: 1;
}

.hero-logo {
  width: 128px;
  height: 128px;

  object-fit: contain;

  margin:
    0 auto 25px;

  display: block;

  filter:
    drop-shadow(0 12px 28px rgba(70,50,30,.12));

  animation:
    floatLogo 5s ease-in-out infinite;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 7px 16px;

  margin-bottom: 22px;

  color: var(--brown-light);
  background: rgba(255,255,255,.72);

  border:
    1px solid var(--gold-light);

  border-radius: 999px;

  font-size: .7rem;
  font-weight: 700;

  letter-spacing: .12em;

  box-shadow:
    0 4px 15px rgba(60,40,20,.04);
}

.hero-title {
  font-family: "Shippori Mincho", serif;

  font-size:
    clamp(3.2rem, 9vw, 7.4rem);

  line-height: 1.05;

  font-weight: 700;

  letter-spacing: .05em;

  color: var(--brown);

  margin-bottom: 14px;
}

.hero-catch {
  font-family: "Shippori Mincho", serif;

  font-size:
    clamp(1.25rem, 2.5vw, 1.75rem);

  color: var(--gold);

  letter-spacing: .14em;

  margin-bottom: 34px;
}

.hero-desc {
  max-width: 650px;

  margin:
    0 auto 20px;

  color: var(--ink-soft);

  font-size: 1rem;

  line-height: 2.15;
}

.hero-desc strong {
  color: var(--brown);
}

.hero-tagline {
  font-family: "Shippori Mincho", serif;

  color: var(--brown);

  font-size:
    clamp(1.3rem, 3vw, 2rem);

  font-weight: 700;

  letter-spacing: .08em;

  line-height: 1.7;

  margin-top: 28px;
}

.hero-tagline-en {
  display: inline-block;

  margin-top: 5px;

  color: var(--muted);

  font-family: "Noto Sans JP", sans-serif;

  font-size: .42em;

  letter-spacing: .1em;
}

.hero-desc-en {
  max-width: 560px;

  margin:
    0 auto 35px;

  color: var(--muted);

  font-size: .76rem;

  line-height: 1.9;

  letter-spacing: .04em;
}


/* =========================================================
   HERO BADGE
   ========================================================= */

.ai-agent-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;

  padding: 9px 17px;

  margin-bottom: 13px;

  color: var(--gold);

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.95),
      rgba(247,241,231,.95)

  border-radius: 999px;

  font-size: .7rem;
  font-weight: 700;

  letter-spacing: .1em;

  box-shadow: var(--shadow-sm);
}


/* =========================================================
   INLINE HERO PANELS
   既存HTMLのインラインstyleを上書き
   ========================================================= */

/* =========================================================
   PRICE BOX
   ========================================================= */

.hero-prices {

}

.price-box:hover {

    var(--shadow-lg);
}

.price-box.special {

    1px solid var(--gold);

    linear-gradient(
      145deg,
      #fff,
      #fbf4e8

}

.price-tag {

  font-size: .68rem;

  letter-spacing: .15em;
}

.price-badge {
  margin:
    8px 0 13px;

  background:

}

/* =========================================================
   BUTTONS
   ========================================================= */

.hero-btns {

  justify-content: center;

  flex-wrap: wrap;
}

.btn-line {

  letter-spacing:

.btn-line:hover {

  box-shadow:
    0 14px 35px rgba(6,199,85,.28);

/* =========================================================
   SECTIONS
   ========================================================= */

.section {
  padding:
    105px 24px;
}

.section-white {

    var(--white);
}

.section-beige {

    var(--bg-soft);
}

.feat-wrap,
.pricing-wrap {

    var(--max);

  margin:

}

.lbl {
  display: inline-block;

  color: var(--gold);

  font-size: .68rem;

  letter-spacing: .24em;

  text-transform: uppercase;

  margin-bottom: 15px;

  padding-bottom: 6px;

  border-bottom:

}

.sec-title {

    "Shippori Mincho",
    serif;

    10px;

.sec-en {

    .78rem;

  letter-spacing:

    52px;
}


/* =========================================================
   FEATURES
   ========================================================= */

.feat-grid {
  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:
    18px;
}

.feat-card {
  position: relative;

  padding:
    38px 32px;

  background:
    var(--white);

  border:
    1px solid var(--border);

  border-radius:
    var(--radius);

  box-shadow:
    0 3px 15px rgba(50,40,30,.025);

  transition:
    transform .3s ease,
    box-shadow .3s ease,
    border-color .3s ease;
}

.feat-card::before {
  content: "";

  position: absolute;

  left: 32px;
  right: 32px;
  top: 0;

  height: 3px;

  background:
    linear-gradient(
      90deg,
      var(--gold),
      transparent
    );

  opacity: 0;

  transition:
    opacity .3s ease;
}

.feat-card:hover {
  transform:
    translateY(-6px);

  border-color:
    var(--gold-light);

  box-shadow:
    var(--shadow);
}

.feat-card:hover::before {
  opacity: 1;
}

.feat-icon-img {
  width: 48px;
  height: 48px;

  margin:
    0 0 20px;

  object-fit: contain;

  opacity: .92;
}

.feat-num {

  color:
    var(--gold);

  font-size: .66rem;

  letter-spacing: .2em;

  margin-bottom:
    8px;
}

.feat-title {

    var(--brown);

  font-family:
    "Shippori Mincho",
    serif;

  font-size:
    1.15rem;

  font-weight:
    700;

  line-height:
    1.5;

  margin-bottom:
    4px;
}

.feat-en {
  display:
    block;

  color:
    var(--muted);

  font-size:
    .68rem;

  margin-bottom:
    15px;
}

.feat-body {

    var(--ink-soft);

  font-size:
    .84rem;

  line-height:
    2;

}

.feat-body em {

    var(--muted);

  font-size:
    .75rem;
}

/* =========================================================
   QUOTE
   ========================================================= */

.quote-wrap {
  max-width:
    820px;

  margin:
    0 auto;

  text-align:
    center;
}

.q-mark {
  display:
    block;

  line-height:

.q-ja {
  color:
    var(--brown);

  font-family:
    "Shippori Mincho",
